<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Young Adults Conference</title>
  <style>
    :root { --bg: #faf8f5; --fg: #222; --accent: #2f5d62; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 32rem; }
    h1 { font-size: clamp(2rem, 8vw, 3rem); margin: 0 0 .5rem; color: var(--accent); }
    p { font-size: 1.15rem; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Young Adults Conference</h1>
    <p>Details and registration are coming soon. Check back here in early December.</p>
  </main>
</body>
</html>
